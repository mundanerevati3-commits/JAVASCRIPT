<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        document.write("<b>Heirarchical Inheritence:</b>")
        class Animal 
        {
            eat()
            {
                document.write(" Eating")
            }
        }
        class Dog extends Animal{}
        class Cat extends Animal{}

        new Dog().eat()
        new Cat().eat()
       
    </script>
</body>
