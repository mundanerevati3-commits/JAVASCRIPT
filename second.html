    <script>
/**
 *  functions
 *    it is a block of a statement or code which is used to perform specific task
 * then that is called as functions.
 * 
 * Types of functions
 *  a) functions with no argument and no return type.
 *     
 function add() // function defined
 {
    var a=12
    var b=90

    document.write("addition="+(a+b)+"<br>")
 }

function substraction()// function defined
 {
    var a=12
    var b=90

    document.write("substraction="+(a+b)+"<br>")
 }

 // function call
add()
add()
add()
add()
substraction()



 *  b) functions with   argument and no return type.
  
 function add(a,b) // function defined
 {
    
    document.write("addition="+(a+b)+"<br>")
 
 }


 // function call
add(34,23)
add(4,2) 



 *  c) functions with no argument and   return type.

  
 function add() // function defined
 {
    
    return 45+23
 
 }


 // function call

 document.write("addition="+(add())+"<br>")
 document.write("addition="+(add())+"<br>")


 
 *  d) functions with   argument and   return type.
 * 
 * 
 function add(a,b) // function defined
 {
    
    return a+b
 
 }


 // function call

 document.write("addition="+(add(34,56))+"<br>")
 document.write("addition="+(add(3,56))+"<br>")




 * 
 * 
 *  a) function defined
 *     here we are suppose to create the business logic or work flow.
 * 
 *  b) function call
 *      it help us to execute the function defined.
 * 
 *  c) Argument
 *      when we declare the variable or pass the value from the parenthises 
 * then that is called as argument.
 * 
 *  d) return 
 *     it is  used to return the value from where the function is call.
 * 
 * 
 * **/

 
 function add() // function defined
 {
    
    return 45+23
 
 }


 // function call

 document.write("addition="+(add())+"<br>")
 document.write("addition="+(add())+"<br>")
